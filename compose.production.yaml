services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: ${EDUSCAN_API_ENV_FILE:-./backend/.env.production}
    environment:
      EDUSCAN_DATA_DIR: /var/lib/eduscan
      EDUSCAN_SEED_DEMO_ACCOUNTS: "false"
      ATTENDANCE_SCHEDULER_ENABLED: "true"
    ports:
      - "127.0.0.1:${EDUSCAN_API_PORT:-8000}:8000"
    volumes:
      - data:/var/lib/eduscan
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  data:
